# Sienna backend stack: dashboard server + MongoDB.
#
#   cd server
#   cp .env.example .env      # then edit DASHBOARD_TOKEN / API keys / Mongo creds
#   docker compose up         # add -d to run detached, --build to rebuild
#
# Compose reads ./.env for ${VAR} interpolation below, and passes the app's
# config to the server via env_file. The `environment:` overrides win over
# env_file and force container-correct values (HTTPS, 0.0.0.0, volume paths).
#
# TLS: the server serves HTTPS/WSS using the host's ./certs bind-mounted into
# the container (read-only). Generate them first if you haven't — see the TLS
# section of .env.example for the openssl one-liner.

services:
  server:
    build: .
    image: sienna-dashboard-server
    restart: unless-stopped
    # Host networking: under WSL2 mirrored networking, Docker's bridge/NAT path
    # stalls TCP flows from LAN devices after the handshake (moby#48201) — the
    # ESP32 could never complete the TLS handshake. On the host stack the
    # mirrored listener works, so the server shares the host network namespace
    # (no `ports:` mapping needed; PORT below is the real host port).
    network_mode: host
    env_file:
      - .env
    environment:
      PORT: "${SERVER_PORT:-3387}"
      LOCALHOST_ONLY: ""          # bind 0.0.0.0 so LAN devices can reach it
      TLS_CERT: /certs/server.crt # HTTPS/WSS — certs bind-mounted below
      TLS_KEY: /certs/server.key
      RECORDINGS_DIR: /data/recordings
      IMAGES_DIR: /data/images
      # Mongo keeps its bridge network + published port; with host networking
      # the server reaches it via the host-published 127.0.0.1:${MONGO_PORT}.
      MONGODB_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@127.0.0.1:${MONGO_PORT:-27017}/${MONGO_DB:-sienna}?authSource=admin"
    volumes:
      - recordings:/data/recordings
      - images:/data/images
      - ./certs:/certs:ro          # host TLS certs (gitignored, never in the image)
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # HTTPS now; skip verification of the self-signed cert for the in-container probe.
      test:
        [
          "CMD-SHELL",
          "NODE_TLS_REJECT_UNAUTHORIZED=0 node -e \"fetch('https://localhost:${SERVER_PORT:-3387}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-sienna}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
  recordings:
  images:
